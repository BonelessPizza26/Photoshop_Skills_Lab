<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Sample practice image: sunset over a lake (swap for your own photo – see README) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1e5c"/>
      <stop offset=".45" stop-color="#d9487d"/>
      <stop offset=".75" stop-color="#ffa45b"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e6b"/>
      <stop offset="1" stop-color="#3a2a6e"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset=".6" stop-color="#ffd25c"/>
      <stop offset="1" stop-color="#ffd25c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="320" fill="url(#sky)"/>
  <circle cx="520" cy="250" r="110" fill="url(#sun)"/>
  <circle cx="520" cy="250" r="55" fill="#fff1b8"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity=".55">
    <ellipse cx="160" cy="90" rx="80" ry="18"/><ellipse cx="210" cy="78" rx="50" ry="16"/>
    <ellipse cx="650" cy="120" rx="70" ry="14"/><ellipse cx="610" cy="110" rx="40" ry="12"/>
  </g>
  <!-- mountains -->
  <polygon points="0,320 120,180 230,320" fill="#5a2f6e"/>
  <polygon points="140,320 300,140 470,320" fill="#47265d"/>
  <polygon points="380,320 560,200 720,320" fill="#5a2f6e"/>
  <polygon points="600,320 720,220 800,280 800,320" fill="#3d2053"/>
  <polygon points="300,140 330,175 310,170 290,185 270,165" fill="#f3d7e8" opacity=".8"/>
  <!-- lake -->
  <rect y="320" width="800" height="180" fill="url(#lake)"/>
  <ellipse cx="520" cy="345" rx="90" ry="6" fill="#fff1b8" opacity=".7"/>
  <ellipse cx="520" cy="365" rx="60" ry="4" fill="#fff1b8" opacity=".5"/>
  <ellipse cx="520" cy="385" rx="35" ry="3" fill="#fff1b8" opacity=".35"/>
  <!-- shore + tree -->
  <path d="M0 420 Q120 395 260 430 L260 500 L0 500 Z" fill="#1d1233"/>
  <rect x="96" y="300" width="12" height="120" fill="#120a22"/>
  <circle cx="102" cy="290" r="44" fill="#1a0f2e"/><circle cx="70" cy="320" r="30" fill="#1a0f2e"/><circle cx="135" cy="318" r="32" fill="#1a0f2e"/>
  <!-- boat -->
  <path d="M600 410 L700 410 L685 428 L615 428 Z" fill="#1a0f2e"/>
  <line x1="650" y1="410" x2="650" y2="360" stroke="#1a0f2e" stroke-width="4"/>
  <polygon points="652,362 652,405 690,405" fill="#f7e0c4"/>
  <!-- birds -->
  <g fill="none" stroke="#2b1e5c" stroke-width="3" stroke-linecap="round">
    <path d="M330 100 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M380 70 q7 -7 14 0 q7 -7 14 0"/>
  </g>
</svg>
